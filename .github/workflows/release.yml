name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Install Qt (Linux/macOS)
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-xkb1 libdbus-1-3 \
            libfuse2 file imagemagick librsvg2-bin

      - name: Cache vcpkg binary archives (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-linux-libgit2-v1
          restore-keys: |
            vcpkg-archives-linux-

      - name: Cache vcpkg binary archives (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-archives-windows-libgit2-v1
          restore-keys: |
            vcpkg-archives-windows-

      - name: Cache vcpkg binary archives (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/vcpkg/archives
          key: vcpkg-archives-macos-libgit2-v1
          restore-keys: |
            vcpkg-archives-macos-

      - name: Setup vcpkg (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install libgit2

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install libgit2:x64-windows

      - name: Setup vcpkg (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install libgit2

      - name: Download linuxdeploy tools
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake -B build -S src -DCMAKE_BUILD_TYPE=Release -G "Ninja" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake -B build -S src -DCMAKE_BUILD_TYPE=Release -G "Unix Makefiles" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake -B build -S src -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

          
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (Linux) - AppImage
        if: runner.os == 'Linux'
        run: |
          echo -e "[Desktop Entry]\nType=Application\nName=Amethyst\nExec=amethyst\nIcon=amethyst\nCategories=Utility;" > amethyst.desktop

          rsvg-convert src/resources/icons/icon.svg -w 256 -h 256 -o amethyst.png

          export QML_SOURCES_PATHS=${{ github.workspace }}/src

          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable build/amethyst \
            --desktop-file amethyst.desktop \
            --icon-file amethyst.png \
            --plugin qt \
            --output appimage
          mv Amethyst-*.AppImage amethyst-linux-${{ github.ref_name }}.AppImage || mv amethyst-*.AppImage amethyst-linux-${{ github.ref_name }}.AppImage

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
      
          if (!(Test-Path "build/amethyst.exe")) {
            throw "build/amethyst.exe was not produced"
          }
      
          Copy-Item build/amethyst.exe package/
      
          # Copy runtime DLL's
          $vcpkgBin = "vcpkg/installed/x64-windows/bin"

          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg bin directory was not found: $vcpkgBin"
          }
          
          Copy-Item "$vcpkgBin/*.dll" package/
      
          # Translations
          New-Item -ItemType Directory -Path "package/Resources/translations" -Force
          Copy-Item build/*.qm "package/Resources/translations/"
      
          # Qt dependencies
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --no-translations `
            package\amethyst.exe
      
          Compress-Archive `
            -Path package/* `
            -DestinationPath amethyst-windows-${{ github.ref_name }}.zip

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Deploy Qt
        if: runner.os == 'macOS'
        run: |
          macdeployqt \
            build/amethyst.app \
            -verbose=2

      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          echo "=== Frameworks ==="
          find build/amethyst.app/Contents/Frameworks \
            -maxdepth 2 \
            -type f \
            -print

          echo "=== Dependencies ==="
          otool -L build/amethyst.app/Contents/MacOS/amethyst

          echo "=== RPATH ==="
          otool -l build/amethyst.app/Contents/MacOS/amethyst | grep -A3 LC_RPATH

      - name: Compile Asset Catalog
        if: runner.os == 'macOS'
        run: |
          mkdir -p car_output
      
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          cp -a build/amethyst.app package/Amethyst.app

          codesign --force --deep -s - package/Amethyst.app

          create-dmg \
            --volname "Amethyst" \
            --background "src/resources/macos/background-dmg.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Amethyst.app" 175 190 \
            --hide-extension "Amethyst.app" \
            --app-drop-link 425 190 \
            "amethyst-macos-${{ github.ref_name }}.dmg" \
            "package/"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: amethyst-${{ runner.os }}-${{ github.ref_name }}
          path: |
            amethyst-linux-${{ github.ref_name }}.AppImage
            amethyst-windows-${{ github.ref_name }}.zip
            amethyst-macos-${{ github.ref_name }}.dmg
          if-no-files-found: error

  build-rpm:
    name: Build RPM (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:41

    steps:
      - name: Install git (required before checkout)
        run: dnf install -y git tar
        
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build rpmdevtools git tar rsync \
            cmake gcc-c++ \
            qt6-qtbase-devel qt6-qttools-devel qt6-qtsvg-devel \
            desktop-file-utils \
            libgit2-devel \
            http-parser-devel

      - name: Setup rpmbuild tree
        run: rpmdev-setuptree
        
      - name: Sync spec version with tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version:.*/Version:        ${TAG_VERSION}/" rpm/amethyst.spec
          echo "version=${TAG_VERSION}" >> "$GITHUB_ENV"

      - name: Build source tarball
        run: |
          STAGE_DIR="$(mktemp -d)/amethyst"
          mkdir -p "$STAGE_DIR"
          rsync -a --exclude='.git' ./ "$STAGE_DIR/"
          tar -C "$(dirname "$STAGE_DIR")" -czf \
            "$HOME/rpmbuild/SOURCES/amethyst-${{ env.version }}.tar.gz" amethyst

      - name: Copy spec file
        run: cp rpm/amethyst.spec "$HOME/rpmbuild/SPECS/"

      - name: Build RPM
        run: |
            echo '%debug_package %{nil}' >> ~/.rpmmacros
            rpmbuild -bb "$HOME/rpmbuild/SPECS/amethyst.spec"

      - name: Rename RPMs for clarity
        run: |
          mkdir -p dist
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp {} dist/ \;
          find "$HOME/rpmbuild/SRPMS" -name '*.rpm' -exec cp {} dist/ \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: amethyst-rpm-${{ github.ref_name }}
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build
      - build-rpm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.rpm
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
